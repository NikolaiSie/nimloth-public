name: Deploy Nonprod

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nonprod
    concurrency:
      group: nonprod-deploy
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform backend
        working-directory: infra/environments/nonprod
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if terraform init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="prefix=nimloth-public/nonprod"; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi

            echo "Terraform init failed; retrying provider download in $((attempt * 10)) seconds."
            sleep "$((attempt * 10))"
          done

      - name: Adopt existing bootstrap resources into Terraform state
        working-directory: infra/environments/nonprod
        shell: bash
        run: |
          set -euo pipefail

          if gcloud artifacts repositories describe nimloth-public \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --location="${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            terraform import -input=false \
              -var="deploy_website=false" \
              -var="container_image=" \
              -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
              -var="region=${{ vars.GCP_REGION }}" \
              -var="data_api_base_url=${{ vars.NIMLOTH_DATA_API_BASE_URL }}" \
              -var="data_api_key=" \
              -var="data_api_audience=" \
              'module.artifact_registry.google_artifact_registry_repository.repository' \
              "projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION }}/repositories/nimloth-public" \
              || true
          fi

          if gcloud iam service-accounts describe \
            "nimloth-public-site@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            terraform import -input=false \
              -var="deploy_website=false" \
              -var="container_image=" \
              -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
              -var="region=${{ vars.GCP_REGION }}" \
              -var="data_api_base_url=${{ vars.NIMLOTH_DATA_API_BASE_URL }}" \
              -var="data_api_key=" \
              -var="data_api_audience=" \
              'module.runtime_service_account.google_service_account.this' \
              "projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/nimloth-public-site@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
              || true
          fi

      - name: Bootstrap nonprod infrastructure
        working-directory: infra/environments/nonprod
        run: |
          terraform apply -input=false -auto-approve \
            -target=module.project_services \
            -target=module.artifact_registry \
            -target=module.runtime_service_account \
            -var="deploy_website=false" \
            -var="container_image=" \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="data_api_base_url=${{ vars.NIMLOTH_DATA_API_BASE_URL }}" \
            -var="data_api_key=" \
            -var="data_api_audience="

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/nimloth-public/nimloth-public:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy website infrastructure
        working-directory: infra/environments/nonprod
        shell: bash
        env:
          TF_VAR_data_api_key: ${{ secrets.NIMLOTH_DATA_API_KEY }}
        run: |
          set -euo pipefail

          if gcloud run services describe nimloth-public-web \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            terraform import -input=false \
              -var="deploy_website=true" \
              -var="container_image=${{ env.IMAGE_URI }}" \
              -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
              -var="region=${{ vars.GCP_REGION }}" \
              -var="data_api_base_url=${{ vars.NIMLOTH_DATA_API_BASE_URL }}" \
              -var="data_api_key=${{ secrets.NIMLOTH_DATA_API_KEY }}" \
              -var="data_api_audience=" \
              'module.website[0].google_cloud_run_v2_service.service' \
              "projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION }}/services/nimloth-public-web" \
              || true
          fi

          terraform apply -input=false -auto-approve \
            -var="deploy_website=true" \
            -var="container_image=${{ env.IMAGE_URI }}" \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="data_api_base_url=${{ vars.NIMLOTH_DATA_API_BASE_URL }}" \
            -var="data_api_key=${{ secrets.NIMLOTH_DATA_API_KEY }}" \
            -var="data_api_audience="

      - name: Show deployed URL
        working-directory: infra/environments/nonprod
        run: terraform output service_url
