name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  web-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

  terraform-format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - nonprod
          - prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize providers
        run: terraform -chdir=infra/environments/${{ matrix.environment }} init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=infra/environments/${{ matrix.environment }} validate

  terraform-module-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - cloud_run_service
          - firebase_hosting

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize providers
        run: terraform -chdir=infra/modules/${{ matrix.module }} init -backend=false -input=false

      - name: Run module tests
        run: terraform -chdir=infra/modules/${{ matrix.module }} test
